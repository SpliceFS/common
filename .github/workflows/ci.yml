name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux (Go ${{ matrix.go }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Codecov upload signs in with the OIDC token instead of a stored secret.
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        go: [stable, oldstable]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
      - name: Module files are tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      # Run as root because that is the configuration the coverage gate is measured
      # in locally (make check-linux runs as root inside its container).
      - name: Format, vet, tests with race detector, 100% coverage
        run: sudo -E env "PATH=$PATH" make check
      # One report per commit is enough, so only the stable Go release uploads. Forks
      # cannot get an OIDC token for this repository. The upload must never fail the
      # build, for example before the organization is enabled on Codecov.
      - name: Upload coverage to Codecov
        if: matrix.go == 'stable' && github.repository == 'SpliceFS/common' && github.event.pull_request.head.repo.fork != true
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
          files: coverage.out
          disable_search: true
          fail_ci_if_error: false
      - name: Build
        run: make build

  macos:
    name: macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      - name: Format, vet, tests with race detector, 100% coverage
        run: make check
      - name: Build
        run: make build

  fuzz:
    name: Fuzz (short)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      - name: Fuzz every target briefly
        run: make fuzz

  lint:
    name: Lint (${{ matrix.goos }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, darwin]
    env:
      GOOS: ${{ matrix.goos }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15
